# Wandb sweep for textured datasets
# Tests different texture configurations and event generation parameters

program: toy_datasets/generate_and_train_hydra.py
project: toydataset-nano-idnet-all-textured  # wandb project name
method: grid
metric:
  name: nonrec/star8_textured_test/final_prediction_nonseq/L1/avg
  goal: minimize

# Hydra configuration
command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}

parameters:
  # Base dataset config - use textured star8
  dataset.base_name:
    value: star8_textured
  
  dataset.save_step:
    values:
      - 20
  
  dataset.total_frames:
    value: 2000
  
  # Texture configuration
  dataset.foreground_texture:
    value: image
  
  dataset.fg_image_path:
    values:
      - data/dtd/images/woven/woven_0053.jpg
      - data/dtd/images/spiralled/spiralled_0137.jpg
      - data/dtd/images/stratified/stratified_0106.jpg
      - data/dtd/images/flecked/flecked_0103.jpg
      - data/dtd/images/honeycombed/honeycombed_0139.jpg
  
  dataset.event_generation_method:
    value: intensity
  
  # Event generation thresholds
  dataset.intensity_pos_threshold:
    values:
      - 0.02
  
  dataset.intensity_neg_threshold:
    values:
      - 0.02
  
  # Model configuration
  model.name:
    values: 
      - NanoIDEDEQIDO
      # - TinyIDEDEQIDO
  
  model.hidden_dim:
    values:
      - 4
      # - 8
      # - 16

  model.input_dim:
    values:
      - 4
      # - 8
      # - 16

  model.mask_channels:
    values:
      - 32
  
  # Training configuration
  training.seed:
    values:
      - 42
      - 420
      - 4200
      - 42000
      - 420000
      # - 24
      # - 240
      # - 2400
      # - 24000
      # - 240000

  training.add_eigenvalues:
    values: 
      - true
      # - false
  
  training.add_filter_values:
    values:
      - true
      # - false

  training.filter_size:
    values:
      - 5

  training.normalize_voxel:
    value: true
  
  training.tau:
    values:
      - 1000

  training.num_bins:
    values:
      - 5

  training.batch_size:
    values:
      - 3

  training.epochs:
    values:
      - 500

