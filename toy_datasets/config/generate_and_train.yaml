# Configuration for generate_and_train_hydra.py
# This combines dataset generation and model training configurations

defaults:
  - dataset_base  # This provides all dataset.* fields
  - shape: star8
  - _self_

# Dataset configuration - inherits all fields from dataset_base
# Override any dataset parameters here
dataset:
  base_name: star8  # Base name for the sequence (variant hash will be appended)

# Model architecture (minimal config for training)
model:
  name: NanoIDEDEQIDO # TinyIDEDEQIDO or NanoIDEDEQIDO
  hidden_dim: 16
  input_dim: 16
  mask_channels: 32
  
# Training hyperparameters (only what's needed for generate_and_train)
training:
  delta_t_ms: null  # Auto-calculated from dataset.save_step * dataset.frame_time_us / 1000
  num_bins: 5
  epochs: 500
  
  # Feature extraction
  add_eigenvalues: true
  add_filter_values: true
  filter_size: 5
  normalize_voxel: true
  tau: 1000
  
  # Optimization
  lr: 1.0e-4
  optimizer: adam
  batch_size: 3
  seed: null
  
  # Data augmentation (only implemented augmentations)
  augmentation:
    vertical_flip: false
    horizontal_flip: false
    random_crop: null  # or "192x192"

# Wandb settings (optional)
wandb:
  project: null
  entity: null
