# @package dataset
# Base configuration for toy dataset generation
# Uses Hydra/OmegaConf for consistency with idn/config

# Dataset identification
seq_name: toy_dataset
outdir: toy_datasets/data

# Dataset generation parameters
total_frames: 2000
image_height: 256
image_width: 256
save_step: 20
frame_time_us: 1000
start_ts_us: 0
test_size: 0.2

# Shape configuration
shape_class: star8
shape_type: star  # For shapes that support type variants (lissajous)

# Rendering options
face_color: black
event_generation_method: synthetic  # synthetic, intensity, or v2e

# Intensity-based event generation parameters
intensity_pos_threshold: 0.05  # Positive threshold for intensity increase (0-1, e.g., 0.05 = 5% brightness change)
intensity_neg_threshold: 0.05  # Negative threshold for intensity decrease (0-1, e.g., 0.05 = 5% brightness change)
intensity_shot_noise_rate_hz: 0.0  # Shot noise rate in Hz per pixel (0 = no noise)

# v2e parameters
v2e_pos_thres: 0.2
v2e_neg_thres: 0.2
v2e_sigma_thres: 0.0
v2e_cutoff_hz: 0
v2e_leak_rate_hz: 0.0
v2e_shot_noise_rate_hz: 0.0
v2e_refractory_period_s: 0.0
v2e_seed: 0
v2e_photoreceptor_noise: false
v2e_leak_jitter_fraction: 0.0
v2e_noise_rate_cov_decades: 0.0
v2e_fg_gamma: 2.0
v2e_bg_gamma: 0.6
v2e_fg_brightness: 1.0
v2e_bg_brightness: 1.0
v2e_temporal_filter_percent: null  # null = no filtering, e.g. 4.0 = keep events in [frame_time, frame_time+4%]

# DTD texture options
dtd_root: data/dtd
use_random_dtd_texture: false
dtd_texture_mode: null  # both, fg, bg, foreground, background
dtd_fg_seed: null  # Seed for foreground DTD texture selection
dtd_bg_seed: null  # Seed for background DTD texture selection
random_seed: null  # Generic random seed (fallback for DTD seeds)

# Texture parameters
foreground_texture: null  # solid, noise, gradient, checkerboard, image
background_texture: null  # solid, noise, gradient, checkerboard, image

# Foreground texture parameters
fg_texture_color: null  # For solid texture
fg_noise_type: null  # gaussian or uniform
fg_noise_scale: null  # Noise intensity (e.g., 0.1)
fg_noise_seed: null  # Random seed for noise
fg_gradient_type: null  # linear or radial
fg_gradient_color1: null  # Start color for gradient
fg_gradient_color2: null  # End color for gradient
fg_gradient_angle: null  # Angle in degrees for linear gradient
fg_checker_size: null  # Square size for checkerboard
fg_checker_color1: null  # First color for checkerboard
fg_checker_color2: null  # Second color for checkerboard
fg_image_path: null  # Path to image file
fg_image_resize_mode: null  # fill, fit, or tile
fg_image_fill_color: null  # Fill color when using 'fit' mode

# Background texture parameters
bg_texture_color: null  # For solid texture
bg_noise_type: null  # gaussian or uniform
bg_noise_scale: null  # Noise intensity (e.g., 0.1)
bg_noise_seed: null  # Random seed for noise
bg_gradient_type: null  # linear or radial
bg_gradient_color1: null  # Start color for gradient
bg_gradient_color2: null  # End color for gradient
bg_gradient_angle: null  # Angle in degrees for linear gradient
bg_checker_size: null  # Square size for checkerboard
bg_checker_color1: null  # First color for checkerboard
bg_checker_color2: null  # Second color for checkerboard
bg_image_path: null  # Path to image file
bg_image_resize_mode: null  # fill, fit, or tile
bg_image_fill_color: null  # Fill color when using 'fit' mode

# Multi-shape parameters (for multi_lissajous)
num_shapes: 3

# Lissajous-specific parameters
freq_ratio_a: 3
freq_ratio_b: 2
rotation_speed: 2.0
shape_size: 20
star_num_points: 5
star_inner_ratio: 0.5
polygon_num_sides: 6
phase_shift: 1.5708  # π/2
amplitude_scale: 0.35

# Triangle-specific parameters  
triangle_base: 40.0
triangle_height: 60.0
added_height: 100.0
start_pos_x: 128.0
start_pos_y: 128.0
movement_direction: 0.0

# Star8-specific parameters
num_points: 5
outer_radius: 40
inner_radius: 20
number_of_rotations: 2

# Generation flags
sanity_check: true
generate_animation: true
animation_frame_step: 10  # Step size for animation frames
animation_fps: 20  # Frames per second for shape animation
generate_event_animation: true
event_accumulation_ms: 10  # Time window for event accumulation in animation
event_animation_fps: 20  # Frames per second for event animation
auto_name: true  # Append config hash to seq_name
force_regenerate: false

defaults:
  - _self_
