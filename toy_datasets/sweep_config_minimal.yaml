# Minimal sweep for quick testing
# Small parameter space to verify the pipeline works correctly
# 
# Usage:
#   1. Create sweep: wandb sweep toy_datasets/sweep_config_minimal.yaml
#   2. Run agents: wandb agent <sweep_id>

program: toy_datasets/generate_and_train.py
project: toydataset-minimal  # wandb project name
method: grid
metric:
  name: val/epe
  goal: minimize

parameters:
  # Dataset parameters
  dataset_save_step:
    values: 
      - 20 
      - 40  # Just 2 values
  
  dataset_total_frames:
    values: 
      - 2000
  
  dataset_test_size:
    values: 
      - 0.2
  
  dataset_base_name:
    values: 
      - "star8"
  
  dataset_outdir:
    values: 
      - "toy_datasets/data/star8"
  
  # Training parameters
  training_num_bins:
    values: 
      - 5 
      - 15  # Just 2 values
  
  training_epochs:
    values: 
      - 50  # Shorter training for quick results
  
  training_seed:
    values: 
      - 42 
      - 420
  
  # Feature hyperparameters
  training_add_eigenvalues:
    values:  
      - false 
      - true  # Fixed
  
  training_add_filter_values:
    values: 
      - false 
      - true  # Fixed
  
  training_filter_size:
    values: 
      - 5 
      - 7  # Fixed
  
  training_tau:
    values: 
      - 5000 
      - 30000  # Just 2 values
  
  training_normalize_voxel:
    values: 
      - true 
      - false  # Test both normalization modes

# This configuration creates:
#
# Good for:
# - Testing the sweep pipeline
# - Quick iteration during development
# - Verifying all hyperparameters are passed correctly
