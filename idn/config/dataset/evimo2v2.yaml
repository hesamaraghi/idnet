dataset_name: evimo2v2
representation_type: voxel
num_voxel_bins: 15
split: eval
image_height: 480
image_width: 640
add_eigenvalues: false
add_filter_values: false
tau: 1000
filter_size: 5
in_memory: false
force_preprocess: false
do_not_save_preprocessed: true
normalize_voxel: true
normalize_aux_voxel: true
skip_invalid: true

common:
  data_root: data/EVIMO2v2/samsung_mono/imo
  test_root: data/EVIMO2v2/samsung_mono/imo/eval
  preprocessed_root: ${oc.env:EVIMO2V2_PREPROCESSED_ROOT,data/EVIMO2v2/preprocessed}

train:
  split: train
  use_all_seqs: true
  seq: []
  load_gt: true
  downsample_ratio: 1
  add_eigenvalues: ${dataset.add_eigenvalues}
  add_filter_values: ${dataset.add_filter_values}
  tau: ${dataset.tau}
  filter_size: ${dataset.filter_size}
  in_memory: ${dataset.in_memory}
  force_preprocess: ${dataset.force_preprocess}
  do_not_save_preprocessed: ${dataset.do_not_save_preprocessed}
  normalize_voxel: ${dataset.normalize_voxel}
  normalize_aux_voxel: ${dataset.normalize_aux_voxel}
  skip_invalid: ${dataset.skip_invalid}

val:
  split: eval
  seq: []
  downsample_ratio: 1
  concat_seq: false
