eval_only: True
callbacks:

data_loader:
  common:
    num_voxel_bins: 15
  train:
    gpu: 0
    args:
      batch_size: 3
  val:
    gpu: 0
    batch_freq: 1500

model:
  pretrain_ckpt: ckpt_dir/cmc692jl/model.ckpt
  add_eigenvalues: ${dataset.train.add_eigenvalues}
  add_filter_values: ${dataset.train.add_filter_values}
  num_voxel_bins: ${data_loader.common.num_voxel_bins}

dataset:
  representation_type: voxel
  common:
    data_root: data/
    test_root: data/test/
  train:
    add_eigenvalues: false
    add_filter_values: false
    tau: 1000 
    filter_size: 5
    in_memory: false
    force_preprocess: false
    do_not_save_preprocessed: true

defaults:
  - hydra: custom_hydra
  - data_loader_base
  - model: id-8x # id-4x
  - dataset: dsec
  - torch_environ_base
  - _self_

